<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cino's extensions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#3072f8;--ink:#0a0a0a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:500 clamp(1.5rem,2.6vw,2.2rem)/1.3 "Segoe Script","Lucida Handwriting","Caveat",cursive}
.page{max-width:80rem;margin:0 auto;padding:2rem 1.5rem 2rem;
  display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1rem 2rem;align-items:center}
.page img{max-width:100%;height:auto;display:block}
.intro,.ext{text-align:center;margin:0}
.files{grid-column:1 / 4;display:flex;justify-content:space-around;align-items:flex-start;gap:2rem;padding:2rem 0}
.item{display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center}
.name{font-size:clamp(2.2rem,5vw,4rem);font-weight:700;line-height:1.1}
.dl{display:inline-flex;color:var(--ink);padding:.5rem;border-radius:1rem}
.dl svg{width:clamp(3.5rem,8vw,6rem);height:auto;display:block}
.dl:hover{background:rgba(255,255,255,.25)}
.dl:focus-visible{outline:4px solid #fff;outline-offset:4px}
.cat{justify-self:center;width:min(100%,22rem)}
.note{max-width:80rem;margin:0 auto;padding:0 1.5rem 2rem;font-size:clamp(1.4rem,3vw,2.2rem)}
@media (max-width:760px){
  .page{grid-template-columns:1fr 1fr}
  .c1{order:1}.intro{order:2}.c2{order:3}.ext{order:4}
  .files{grid-column:1 / 3;order:5;flex-direction:column;align-items:center}
  .cat{grid-column:1 / 3;order:6;width:min(80%,18rem)}
}
</style>
</head>
<body>
<main class="page">
  <img class="c1" src="images/cino1.png" alt="Cartoon character with big sparkly eyes" width="260" height="295">
  <p class="intro">hiii<br>my name is cino</p>
  <img class="c2" src="images/cino2.png" alt="Cartoon character with a pink bow" width="230" height="240">
  <p class="ext">and thwese awe my extwensions</p>

  <div class="files">
    <div class="item">
      <span class="name">gwoogle and bwave</span>
      <a class="dl" href="files/GOOGLE-AND-BRAVE.zip" download aria-label="Download the Google and Brave extension (zip)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      </a>
    </div>
    <div class="item">
      <span class="name">fiwefox</span>
      <a class="dl" href="files/FIREFOX.zip" download aria-label="Download the Firefox extension (zip)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      </a>
    </div>
  </div>
  <img class="cat" src="images/cat.png" alt="White cat pointing at the downloads" width="365" height="340">
</main>
<p class="note">all files are zip files*</p>
</body>
</html>
